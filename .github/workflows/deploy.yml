name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # index.html links style.css and script.js directly, so the site that is
      # published is exactly the site in the repository.
      - name: Check that every local asset referenced by index.html exists
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          refs = set(re.findall(r'(?:src|href)="([^"#:?]+\.[a-z0-9]+)(?:\?[^"]*)?"', html))
          refs |= set(re.findall(r"'\./([^']+)'", Path('script.js').read_text(encoding='utf-8')))
          missing = sorted(r for r in refs if not Path(r.lstrip('./')).exists())
          if missing:
              print('Missing assets:', ', '.join(missing))
              sys.exit(1)
          print('All', len(refs), 'local assets found')
          PY

      # Stamp the CSS/JS links with this commit so browsers never mix old and new files.
      - name: Version CSS and JS links
        run: sed -i -E "s#(style\.css|script\.js|favicon\.ico|favicon\.svg|favicon-192\.png|apple-touch-icon\.png)\?v=[A-Za-z0-9]+#\1?v=${GITHUB_SHA::8}#g" index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # The artifact can take a few seconds to become visible to the deploy step.
      - name: Wait for artifact to be listed
        run: sleep 20

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
