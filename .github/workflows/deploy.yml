name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Add smooth loading and transition enhancements
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          html_path = root / 'index.html'
          html = html_path.read_text(encoding='utf-8')

          css = r'''
          /* Deploy-time motion enhancement: preserves the original visual theme. */
          .page-loader {
              position: fixed;
              inset: 0;
              z-index: 10000;
              display: grid;
              place-items: center;
              background: #050505;
              opacity: 1;
              visibility: visible;
              transition: opacity .7s cubic-bezier(.16,1,.3,1), visibility .7s;
          }
          .page-loader.is-loaded {
              opacity: 0;
              visibility: hidden;
              pointer-events: none;
          }
          .page-loader__mark {
              width: 42px;
              height: 42px;
              border: 2px solid rgba(255,255,255,.12);
              border-top-color: #cc0000;
              border-radius: 50%;
              animation: portfolio-loader-spin .8s linear infinite;
          }
          .page-loader__line {
              position: absolute;
              bottom: 0;
              left: 0;
              width: 100%;
              height: 2px;
              background: #cc0000;
              transform-origin: left center;
              animation: portfolio-loader-progress 1.15s cubic-bezier(.16,1,.3,1) both;
          }
          body.page-ready > *:not(.page-loader) {
              animation: portfolio-page-enter .8s cubic-bezier(.16,1,.3,1) both;
          }
          a[href^="#"] { scroll-behavior: smooth; }
          @keyframes portfolio-loader-spin { to { transform: rotate(360deg); } }
          @keyframes portfolio-loader-progress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
          @keyframes portfolio-page-enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
          @media (prefers-reduced-motion: reduce) {
              .page-loader__mark, .page-loader__line { animation: none; }
              .page-loader, body.page-ready > *:not(.page-loader) { transition: none; animation: none; }
          }
          '''

          js = r'''
          (() => {
              const loader = document.createElement('div');
              loader.className = 'page-loader';
              loader.setAttribute('aria-hidden', 'true');
              loader.innerHTML = '<div class="page-loader__mark"></div><div class="page-loader__line"></div>';
              document.body.prepend(loader);

              const finishLoading = () => {
                  requestAnimationFrame(() => {
                      document.body.classList.add('page-ready');
                      loader.classList.add('is-loaded');
                      window.setTimeout(() => loader.remove(), 800);
                  });
              };

              if (document.readyState === 'complete') finishLoading();
              else window.addEventListener('load', finishLoading, { once: true });

              document.addEventListener('click', (event) => {
                  const link = event.target.closest('a[href^="#"]');
                  if (!link) return;
                  const target = document.querySelector(link.getAttribute('href'));
                  if (!target) return;
                  event.preventDefault();
                  target.scrollIntoView({ behavior: 'smooth', block: 'start' });
              });
          })();
          '''

          (root / 'deploy-motion.css').write_text(css.strip() + '\n', encoding='utf-8')
          (root / 'deploy-motion.js').write_text(js.strip() + '\n', encoding='utf-8')

          css_tag = '<link rel="stylesheet" href="deploy-motion.css">'
          js_tag = '<script src="deploy-motion.js" defer></script>'
          if css_tag not in html:
              html = html.replace('</head>', f'    {css_tag}\n</head>', 1)
          if js_tag not in html:
              html = html.replace('</body>', f'    {js_tag}\n</body>', 1)
          html_path.write_text(html, encoding='utf-8')

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
