name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enable premium portfolio enhancements
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="enhancements.css?v=20260907">'
          js = '<script src="enhancements.js?v=20260907" defer></script>'
          if 'href="enhancements.css"' not in html and 'href="enhancements.css?v=' not in html:
              html = html.replace('</head>', f'    {css}\n</head>', 1)
          elif 'href="enhancements.css"' in html:
              html = html.replace('href="enhancements.css"', 'href="enhancements.css?v=20260907"', 1)
          if 'src="enhancements.js"' not in html and 'src="enhancements.js?v=' not in html:
              html = html.replace('</body>', f'    {js}\n</body>', 1)
          elif 'src="enhancements.js"' in html:
              html = html.replace('src="enhancements.js"', 'src="enhancements.js?v=20260907"', 1)
          path.write_text(html, encoding='utf-8')

      - name: Enable Phase 2 editorial hero
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="phase2.css?v=20260907-p2">'
          js = '<script src="phase2.js?v=20260907-p2" defer></script>'
          if 'href="phase2.css"' not in html and 'href="phase2.css?v=' not in html:
              html = html.replace('</head>', f'    {css}\n</head>', 1)
          if 'src="phase2.js"' not in html and 'src="phase2.js?v=' not in html:
              html = html.replace('</body>', f'    {js}\n</body>', 1)
          path.write_text(html, encoding='utf-8')

      - name: Enable hero reference presentation
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="hero-reference.css?v=20260907-p3hero">'
          js = '<script src="hero-reference.js?v=20260907-p3hero" defer></script>'
          if 'href="hero-reference.css"' not in html and 'href="hero-reference.css?v=' not in html:
              html = html.replace('</head>', f'    {css}\n</head>', 1)
          if 'src="hero-reference.js"' not in html and 'src="hero-reference.js?v=' not in html:
              html = html.replace('</body>', f'    {js}\n</body>', 1)
          path.write_text(html, encoding='utf-8')

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
