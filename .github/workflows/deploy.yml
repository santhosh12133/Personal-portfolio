name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Add smooth loading and interaction enhancements
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          html_path = root / 'index.html'
          html = html_path.read_text(encoding='utf-8')

          css = r'''
          /* Deploy-time enhancement layer. Original HTML/CSS/JS/theme remain untouched. */
          .page-loader{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;background:#050505;opacity:1;visibility:visible;transition:opacity .7s cubic-bezier(.16,1,.3,1),visibility .7s}
          .page-loader.is-loaded{opacity:0;visibility:hidden;pointer-events:none}
          .page-loader__mark{width:42px;height:42px;border:2px solid rgba(255,255,255,.12);border-top-color:#cc0000;border-radius:50%;animation:portfolio-loader-spin .8s linear infinite}
          .page-loader__line{position:absolute;bottom:0;left:0;width:100%;height:2px;background:#cc0000;transform-origin:left center;animation:portfolio-loader-progress 1.15s cubic-bezier(.16,1,.3,1) both}
          body.page-ready > *:not(.page-loader){animation:portfolio-page-enter .8s cubic-bezier(.16,1,.3,1) both}
          .portfolio-aura{position:fixed;width:260px;height:260px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(204,0,0,.08),transparent 68%);transform:translate(-50%,-50%);opacity:0;transition:opacity .4s ease;mix-blend-mode:screen}
          .portfolio-card-glow{position:relative;overflow:hidden}
          .portfolio-card-glow::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),rgba(204,0,0,.12),transparent 65%);opacity:0;transition:opacity .35s ease}
          .portfolio-card-glow:hover::after{opacity:1}
          .portfolio-ripple{position:absolute;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.28);transform:translate(-50%,-50%) scale(0);pointer-events:none;animation:portfolio-ripple .6s ease-out forwards}
          .portfolio-top{position:fixed;right:24px;bottom:24px;width:44px;height:44px;border:1px solid rgba(255,255,255,.18);background:rgba(5,5,5,.72);color:#fff;backdrop-filter:blur(10px);z-index:90;display:grid;place-items:center;opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .35s ease,visibility .35s ease,transform .35s ease;cursor:pointer}
          .portfolio-top.is-visible{opacity:1;visibility:visible;transform:translateY(0)}
          .portfolio-top:hover{border-color:#cc0000;color:#cc0000}
          @keyframes portfolio-loader-spin{to{transform:rotate(360deg)}}
          @keyframes portfolio-loader-progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
          @keyframes portfolio-page-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
          @keyframes portfolio-ripple{to{transform:translate(-50%,-50%) scale(18);opacity:0}}
          @media (pointer:coarse){.portfolio-aura{display:none}}
          @media (prefers-reduced-motion:reduce){.page-loader__mark,.page-loader__line{animation:none}.page-loader,body.page-ready > *:not(.page-loader){transition:none;animation:none}.portfolio-aura{display:none}.portfolio-ripple{display:none}}
          '''

          js = r'''
          (() => {
              const loader = document.createElement('div');
              loader.className = 'page-loader';
              loader.setAttribute('aria-hidden', 'true');
              loader.innerHTML = '<div class="page-loader__mark"></div><div class="page-loader__line"></div>';
              document.body.prepend(loader);

              const finishLoading = () => requestAnimationFrame(() => {
                  document.body.classList.add('page-ready');
                  loader.classList.add('is-loaded');
                  window.setTimeout(() => loader.remove(), 800);
              });
              if (document.readyState === 'complete') finishLoading();
              else window.addEventListener('load', finishLoading, { once: true });

              const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
              const desktop = window.matchMedia('(pointer:fine)').matches;

              if (!reduceMotion) {
                  const aura = document.createElement('div');
                  aura.className = 'portfolio-aura';
                  document.body.appendChild(aura);
                  let raf = 0, x = 0, y = 0;
                  window.addEventListener('pointermove', e => {
                      if (!desktop) return;
                      x = e.clientX; y = e.clientY;
                      if (!raf) raf = requestAnimationFrame(() => { aura.style.left = x + 'px'; aura.style.top = y + 'px'; aura.style.opacity = '.8'; raf = 0; });
                  }, { passive: true });
                  window.addEventListener('pointerleave', () => aura.style.opacity = '0');

                  document.querySelectorAll('.project-visual,.edu-card,.skill-card,.tech-pill,.architecture-node').forEach(card => {
                      card.classList.add('portfolio-card-glow');
                      card.addEventListener('pointermove', e => {
                          const r = card.getBoundingClientRect();
                          card.style.setProperty('--mx', ((e.clientX-r.left)/r.width*100)+'%');
                          card.style.setProperty('--my', ((e.clientY-r.top)/r.height*100)+'%');
                      }, { passive: true });
                  });

                  document.querySelectorAll('.btn,.nav-cta,.footer-top-link').forEach(button => {
                      button.addEventListener('click', e => {
                          const r = button.getBoundingClientRect();
                          const ripple = document.createElement('span');
                          ripple.className = 'portfolio-ripple';
                          ripple.style.left = (e.clientX-r.left)+'px';
                          ripple.style.top = (e.clientY-r.top)+'px';
                          if (getComputedStyle(button).position === 'static') button.style.position = 'relative';
                          button.appendChild(ripple);
                          window.setTimeout(() => ripple.remove(), 650);
                      });
                  });
              }

              const top = document.createElement('button');
              top.className = 'portfolio-top';
              top.type = 'button';
              top.setAttribute('aria-label', 'Back to top');
              top.innerHTML = '&uarr;';
              document.body.appendChild(top);
              const updateTop = () => top.classList.toggle('is-visible', window.scrollY > 650);
              window.addEventListener('scroll', updateTop, { passive: true });
              updateTop();
              top.addEventListener('click', () => window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }));

              document.addEventListener('click', event => {
                  const link = event.target.closest('a[href^="#"]');
                  if (!link) return;
                  const id = link.getAttribute('href');
                  if (!id || id === '#') return;
                  const target = document.querySelector(id);
                  if (!target) return;
                  event.preventDefault();
                  target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
              });
          })();
          '''

          (root / 'deploy-motion.css').write_text(css.strip() + '\n', encoding='utf-8')
          (root / 'deploy-motion.js').write_text(js.strip() + '\n', encoding='utf-8')

          css_tag = '<link rel="stylesheet" href="deploy-motion.css">'
          js_tag = '<script src="deploy-motion.js" defer></script>'
          if css_tag not in html:
              html = html.replace('</head>', f'    {css_tag}\n</head>', 1)
          if js_tag not in html:
              html = html.replace('</body>', f'    {js_tag}\n</body>', 1)
          html_path.write_text(html, encoding='utf-8')

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
